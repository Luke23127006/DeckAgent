[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deckagent-project-hub"
version = "0.1.0"
description = "Read-only local Google Sheets snapshot tool for the Project Hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
project-hub = "project_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_hub"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

