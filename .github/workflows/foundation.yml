name: Foundation CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Gate 001 (Windows)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
          cache: true

      - name: Record toolchain
        run: |
          node --version
          pnpm --version

      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        id: build
        run: pnpm build

      - name: Foundation integration smoke tests
        id: smoke
        timeout-minutes: 2
        run: pnpm test:foundation

      - name: Boot and unload foundation CLI
        id: boot
        timeout-minutes: 2
        run: pnpm start:foundation

      - name: UX prototype regression
        id: ux
        run: node tests/ux-02-prototype.test.cjs

      - name: Record verification evidence
        if: always()
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          BOOT_RESULT: ${{ steps.boot.outcome }}
          UX_RESULT: ${{ steps.ux.outcome }}
        run: |
          @"
          ## Foundation verification
          - Tested SHA: $env:TESTED_SHA
          - Event: $env:RUN_EVENT
          - Environment: windows-2022, Node 22.19.0; pnpm from package.json
          - Install: $env:INSTALL_RESULT
          - Build/typecheck: $env:BUILD_RESULT
          - Integration smoke: $env:SMOKE_RESULT
          - Boot/unload: $env:BOOT_RESULT
          - UX regression: $env:UX_RESULT
          - Run: $env:RUN_URL

          For Gate 001 on dev, record a successful push run on the merged dev SHA in PROGRESS.md.
          PR runs verify the proposed merge; they do not close the integration gate on dev.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
