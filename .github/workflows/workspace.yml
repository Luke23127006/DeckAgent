name: Workspace CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace Verification (Windows)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
          cache: true

      - name: Record toolchain
        run: |
          node --version
          pnpm --version

      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        id: build
        run: pnpm build

      - name: Lint (Biome)
        id: lint
        run: pnpm lint

      - name: Cordis smoke tests
        id: smoke
        timeout-minutes: 2
        run: pnpm test:cordis-smoke

      - name: DeckAgent runtime tests (TASK-002-A)
        id: runtime
        timeout-minutes: 2
        run: pnpm test:agent-runtime

      - name: Model provider and manual CLI checks (TASK-002-B, local HTTP only)
        id: providers
        timeout-minutes: 2
        run: pnpm test:model-providers

      - name: Boot and unload Cordis smoke CLI
        id: boot
        timeout-minutes: 2
        run: pnpm start:cordis-smoke

      - name: Durable Session and process restart checks (TASK-002-C, local HTTP only)
        id: sessions
        timeout-minutes: 2
        run: pnpm test:session-persistence

      - name: Chat first-run setup and Windows encrypted credentials (local HTTP only)
        id: chat_setup
        timeout-minutes: 3
        run: pnpm test:chat-setup

      - name: File Tools, Host API and browser connection (TASK-003, local fixtures)
        id: tools_browser
        timeout-minutes: 2
        run: pnpm test:tools-browser

      - name: Dotenv and repairable Web startup (local fixtures)
        id: env_startup
        timeout-minutes: 2
        run: pnpm test:env-startup

      - name: Local Web settings, model snapshots and activities (TASK-004, local HTTP and DPAPI)
        id: local_web
        timeout-minutes: 2
        run: pnpm test:local-web

      - name: Local foundation workspaces, chats and storage (B01, local SQLite and HTTP)
        id: local_foundation
        timeout-minutes: 2
        run: pnpm test:local-foundation

      - name: Models and requests through a fake OpenCode CLI (B02, local SQLite, HTTP and DPAPI)
        id: model_requests
        timeout-minutes: 4
        run: pnpm test:model-requests

      - name: Sources, request-scoped MCP and one-step approval (local fixtures)
        id: source_permissions
        timeout-minutes: 3
        run: pnpm test:source-permissions

      - name: Real browser workspaces, chats, drafts and deck canvas smoke (Chrome headless, local fixtures)
        id: browser
        timeout-minutes: 2
        run: pnpm test:browser-smoke

      - name: Slide publication, Deck SSE and client state (TASK-005, local fixtures)
        id: slide_pipeline
        timeout-minutes: 2
        run: pnpm test:slide-pipeline

      - name: Outline state and client (local fixtures)
        id: outline_workflow
        timeout-minutes: 2
        run: pnpm test:outline-workflow

      - name: Record verification evidence
        if: always()
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          RUNTIME_RESULT: ${{ steps.runtime.outcome }}
          PROVIDERS_RESULT: ${{ steps.providers.outcome }}
          SESSIONS_RESULT: ${{ steps.sessions.outcome }}
          CHAT_SETUP_RESULT: ${{ steps.chat_setup.outcome }}
          BOOT_RESULT: ${{ steps.boot.outcome }}
          TOOLS_BROWSER_RESULT: ${{ steps.tools_browser.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          ENV_STARTUP_RESULT: ${{ steps.env_startup.outcome }}
          LOCAL_WEB_RESULT: ${{ steps.local_web.outcome }}
          SLIDE_PIPELINE_RESULT: ${{ steps.slide_pipeline.outcome }}
          OUTLINE_WORKFLOW_RESULT: ${{ steps.outline_workflow.outcome }}
          LOCAL_FOUNDATION_RESULT: ${{ steps.local_foundation.outcome }}
          MODEL_REQUESTS_RESULT: ${{ steps.model_requests.outcome }}
          SOURCE_PERMISSIONS_RESULT: ${{ steps.source_permissions.outcome }}
        run: |
          @"
          ## Workspace verification
          - Tested SHA: $env:TESTED_SHA
          - Event: $env:RUN_EVENT
          - Environment: windows-2022, Node 22.19.0; pnpm from package.json
          - Install: $env:INSTALL_RESULT
          - Build/typecheck: $env:BUILD_RESULT
          - Lint (Biome): $env:LINT_RESULT
          - Integration smoke: $env:SMOKE_RESULT
          - DeckAgent runtime (TASK-002-A only): $env:RUNTIME_RESULT
          - Model providers (TASK-002-B, local HTTP only): $env:PROVIDERS_RESULT
          - Session persistence (TASK-002-C, local HTTP only): $env:SESSIONS_RESULT
          - Chat first-run setup (local HTTP, Windows DPAPI): $env:CHAT_SETUP_RESULT
          - Boot/unload: $env:BOOT_RESULT
          - File Tools / Host API / browser client: $env:TOOLS_BROWSER_RESULT
          - Local foundation / workspaces / chats / storage: $env:LOCAL_FOUNDATION_RESULT
          - Models / requests / fake OpenCode CLI (no real CLI or provider): $env:MODEL_REQUESTS_RESULT
          - Sources / request-scoped MCP / one-step approval (local fixtures): $env:SOURCE_PERMISSIONS_RESULT
          - Real browser workspaces / chats / drafts / deck canvas: $env:BROWSER_RESULT
          - Dotenv startup / environment precedence / Web settings without credentials: $env:ENV_STARTUP_RESULT
          - Local Web / model snapshots / encrypted settings / activity persistence: $env:LOCAL_WEB_RESULT
          - Slide publication / immutable storage / Deck SSE / reconnect: $env:SLIDE_PIPELINE_RESULT
          - Outline state / client: $env:OUTLINE_WORKFLOW_RESULT
          - Run: $env:RUN_URL

          Record this run URL and tested SHA in the task's GitHub Issue. A successful push run on
          dev supplies automated evidence; also verify every criterion of the gate.
          Gate 002 additionally requires a real-model request and history readback
          after Host restart on the accepted baseline (manual evidence; no cloud keys
          are required by this workflow). PR runs verify the proposed merge only.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
