<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeckAgent V1 · Prototype tương tác</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--ink:#1F1F1D;--mut:#5A5A54;--mut2:#44443F;--line:#C9C9C4;--line2:#D5D5CF;--bg:#F3F3F1;--panel:#fff;--soft:#FAFAF8;--rail:#EDEDE9;--sel:#D9D9D3;--chip:#E8E8E4;--bad:#8A1C1C;--pend:#FFF1CC;--pendInk:#7A4300}
html,body{height:100%;margin:0}
body{font:14px/1.4 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid #1D4ED8;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#root{height:100%;filter:grayscale(1)}
.app{display:flex;height:100%;min-width:860px}
/* rail */
.rail{width:236px;flex:none;background:var(--rail);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.wm{font:600 17px 'IBM Plex Mono',monospace;letter-spacing:.02em;padding:2px 2px 4px}
.btn{font:600 12.5px 'IBM Plex Sans',sans-serif;border:1.5px solid var(--ink);background:#fff;border-radius:6px;padding:6px 12px;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--chip)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.pr{background:var(--ink);color:#fff}
.btn.pr:hover:not(:disabled){background:#000}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled,.btn.dis{border-color:#A9A9A2;border-style:dashed;color:#6B6B66;background:#ECECE8}
.rl{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.ri{display:flex;flex-direction:column;gap:2px;padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:#F8F8F5;text-align:left;width:100%;font-size:13px}
.ri small{font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ri.on{background:var(--sel);border-color:#8F8F88}
.ri:hover{background:#fff}
.ri.on:hover{background:var(--sel)}
.rail .empty{border:1.5px dashed #A9A9A2;border-radius:6px;padding:10px;font-size:12px;color:var(--mut2);text-align:center}
.tg{font:600 10px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:#E3E3DE;color:#2F2F2B;white-space:nowrap;display:inline-block}
.tg.pd{background:var(--pend);color:var(--pendInk);border:1px dashed #B86E00}
.tg.o{background:#fff;border:1px solid #A9A9A2}
.banner{border:1.5px solid var(--ink);border-radius:8px;background:#fff;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.banner .x{margin-left:auto;border:0;background:transparent;padding:2px 4px;line-height:1}
.banner.bad{border-color:var(--bad)}
/* center */
.ctr{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line)}
.tb{height:52px;flex:none;border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:center;gap:10px;font-weight:600}
.tb .sub{font-weight:400;font-size:12px;color:var(--mut)}
.cv{flex:1;min-height:0;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.empty-chat{margin:auto;max-width:420px;text-align:center;border:1.5px dashed #A9A9A2;border-radius:8px;padding:24px;color:var(--mut2);display:flex;flex-direction:column;gap:8px}
.empty-chat b{font-size:16px;color:var(--ink)}
.m-u{align-self:flex-end;max-width:84%;background:#DADAD4;border-radius:12px;padding:8px 12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.m-u .fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.m-s{align-self:flex-start;max-width:94%;background:#F0F0EC;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px;word-break:break-word}
.m-s p{margin:0}
.m-s.old{background:#F7F7F4;color:var(--mut);border-style:dashed}
.lb{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px}
.ol li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ol b{font-weight:600}
.mk2{background:var(--pend);border:1px dashed #B86E00;color:var(--pendInk);padding:0 5px;border-radius:3px;font-size:11.5px}
.mk3{background:#fff;border:1.5px solid var(--ink);padding:0 5px;border-radius:3px;font-size:11.5px;font-weight:600}
.m-n{align-self:flex-start;max-width:94%;border:1.5px solid #8F8F88;border-radius:8px;background:#fff;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.m-n.bad{border-color:var(--bad)}
.m-n h4{margin:0;font-size:13px}
.m-n p{margin:0}
.m-n .acts{display:flex;gap:8px;flex-wrap:wrap}
.m-i{align-self:center;font:400 12px 'IBM Plex Mono',monospace;color:var(--mut2);text-align:center}
.status{font:500 12px 'IBM Plex Mono',monospace;color:var(--ink);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse 1.2s infinite}
.dot.w{background:transparent;border:1.5px solid var(--ink);animation:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot,.spin{animation:none}}
/* dock + composer */
.dock{flex:none;padding:0 20px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
.qcard{border:1.5px solid #6B6B66;border-radius:14px;background:#F7F7F4;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.qcard .qt{font-weight:600;font-size:13px}
.qrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px 10px;font:500 13px 'IBM Plex Sans',sans-serif}
.qrow:hover{background:var(--chip)}
.qrow .qn{display:inline-flex;width:20px;height:20px;border-radius:10px;border:1px solid #6B6B66;align-items:center;justify-content:center;font-size:11px;flex:none}
.qhint{font-size:11.5px;color:var(--mut2)}
.hint{font-size:12px;color:var(--mut2)}
.err{border:1.5px solid var(--bad);border-radius:8px;background:#fff;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#1F1F1D}
.err b{color:var(--bad)}
.err .x{margin-left:auto;border:0;background:transparent;padding:2px 4px}
.cmp{border:1.5px solid #8F8F88;border-radius:18px;background:#fff;padding:10px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
.cmp:focus-within{border-color:var(--ink)}
.cmp textarea{border:0;outline:0;resize:none;width:100%;min-height:44px;max-height:180px;font-size:13.5px;background:transparent;padding:0}
.cmp.over{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fc{display:flex;align-items:center;gap:6px;border:1px solid #8F8F88;border-radius:8px;background:#fff;padding:3px 4px 3px 8px;font-size:12px;max-width:230px}
.fc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;background:transparent;border:0;padding:0;text-align:left}
.fc .ty{font:600 9.5px 'IBM Plex Mono',monospace;color:var(--mut)}
.fc .fx{border:0;background:transparent;padding:2px 4px;line-height:1}
.fc.bad{border-color:var(--bad);background:#FBF3F3}
.fc.sent{padding:3px 8px}
.spin{width:14px;height:14px;border:2px solid #D5D5CF;border-top-color:var(--ink);border-radius:50%;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.cbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plus{width:30px;height:30px;border-radius:15px;border:1.5px solid #6B6B66;background:#fff;font:500 18px/1 'IBM Plex Sans',sans-serif;padding:0;display:inline-flex;align-items:center;justify-content:center}
.plus:hover{background:var(--chip)}
.mpick{border-radius:8px;padding:4px 8px;font-size:12px;display:flex;gap:6px;align-items:center;background:#F3F3F1;border:1px solid var(--line);max-width:260px}
.mpick .mid{font-family:'IBM Plex Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpick.warn{border-color:var(--bad);background:#fff}
.snd{width:30px;height:30px;border-radius:15px;background:var(--ink);color:#fff;border:0;font-size:15px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.snd.off{background:#D5D5CF;color:#6B6B66}
.snd.stop{font-size:11px}
.pop{position:absolute;z-index:20;background:#fff;border:1.5px solid var(--ink);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.pop.plusp{left:8px;bottom:calc(100% + 8px);padding:4px;min-width:220px}
.pop .it{display:flex;gap:8px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px}
.pop .it:hover{background:var(--chip)}
.menu{right:0;bottom:calc(100% + 8px);width:293px;overflow:visible}
.tabs{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{font:500 11.5px 'IBM Plex Sans',sans-serif;padding:4px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent;color:var(--mut2);background:transparent}
.chip.on{background:#E3E3DE;border-color:#A9A9A2;color:var(--ink);font-weight:600}
.tabs .ib{width:26px;height:26px;border:1px solid #A9A9A2;border-radius:6px;background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;font:500 15px/1 'IBM Plex Sans',sans-serif}
.mls{padding:6px;display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.mi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font:500 12px 'IBM Plex Mono',monospace;border:0;background:transparent;width:100%;text-align:left;position:relative}
.mi:hover{background:var(--chip)}
.mi.on{background:var(--sel)}
.mi .eff{font:500 11.5px 'IBM Plex Sans',sans-serif;display:inline-flex;gap:4px;align-items:center;border:0;background:transparent;padding:2px 4px;border-radius:4px}
.mn{padding:8px 12px;font-size:12px;color:var(--mut2)}
.menu .bn{display:flex;gap:8px;align-items:flex-start;margin:6px 10px 0;padding:6px 8px;border:1px solid #C9C9C4;border-radius:6px;font-size:11.5px;background:#fff}
.effm{position:absolute;right:0;top:100%;z-index:25;width:200px;background:#fff;border:1.5px solid var(--ink);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:4px;font:500 12px 'IBM Plex Sans',sans-serif}
.effm div{padding:6px 8px;border-radius:6px;cursor:pointer}
.effm div:hover{background:var(--chip)}
.effm .h{cursor:default;font:600 10px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2)}
/* deck */
.dk{width:400px;flex:none;background:#F1F1EE;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.dk .hd{display:flex;justify-content:space-between;align-items:center}
.sl{background:#fff;border:1px solid #6B6B66;aspect-ratio:16/9;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:12px;min-height:0;overflow:hidden}
.sl h3{margin:0;font-size:15px}
.sl ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.sl .ph{border:1px dashed #6B6B66;padding:2px 6px;color:var(--mut);font-size:11px;align-self:flex-start}
.sl.todo{border-style:dashed;background:transparent;color:var(--mut)}
.sl.bld{border-style:dashed;color:var(--mut2)}
.th{display:flex;flex-direction:column;gap:3px;width:62px;font-size:11px;color:var(--mut2);border:0;background:transparent;padding:0;text-align:left}
.th .sl{padding:5px;gap:3px;aspect-ratio:16/9}
.bar{height:6px;background:#D0D0CA;border-radius:2px}
.th.sel .sl{outline:3px solid #1D4ED8;outline-offset:1px}
.thr{display:flex;flex-wrap:wrap;gap:8px}
.dkn{border:1px solid #C9C9C4;border-radius:6px;background:#fff;padding:8px 10px;font-size:12px}
.confirmed{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px}
/* settings */
.set{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.set .sh{height:52px;flex:none;border-bottom:1px solid var(--line);padding:0 18px;display:flex;align-items:center;gap:12px;background:var(--chip);font-weight:600}
.set .sb{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px;max-width:980px}
.sec{border:1.5px solid var(--ink);border-radius:8px;background:#fff;display:flex;flex-direction:column}
.sec>.h{padding:9px 14px;border-bottom:1px solid var(--line);background:var(--chip);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.sec>.b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cfg{border:1px solid #8F8F88;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.cfg .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut2)}
.mchip{display:inline-flex;gap:6px;align-items:center;border:1px solid #6B6B66;border-radius:4px;padding:2px 4px 2px 8px;font:500 12px 'IBM Plex Mono',monospace;background:#F6F6F3}
.mchip button{border:0;background:transparent;padding:0 3px;line-height:1}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px}
.fld label{font-weight:600}
.fld input,.fld select{border:1px solid #6B6B66;border-radius:5px;padding:6px 8px;background:#fff;font-size:13px;width:100%}
.fld input:disabled{background:#ECECE8;color:#6B6B66}
.fld.bad input,.fld.bad select{border-color:var(--bad)}
.fld .msg{color:var(--bad);font-size:12px}
.fld .note{color:var(--mut2);font-size:11.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cb{display:flex;gap:8px;align-items:center;font:500 12px 'IBM Plex Mono',monospace;padding:4px 0;border-bottom:1px solid #E1E1DC}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ok{border:1.5px solid var(--ink);border-radius:6px;background:#fff;padding:6px 10px;font-size:12.5px}
.dlgbk{position:fixed;inset:0;background:rgba(31,31,29,.35);z-index:60;display:flex;align-items:center;justify-content:center}
.dlg{width:min(460px,92vw);background:#fff;border:1.5px solid var(--ink);border-radius:12px;box-shadow:0 10px 36px rgba(0,0,0,.3);padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:16px}
.dlg p{margin:0;font-size:13px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;max-width:80vw}
/* sim panel */
.simb{position:fixed;right:14px;bottom:14px;z-index:50;font:600 12px 'IBM Plex Sans',sans-serif;border:1.5px dashed var(--ink);background:#fff;border-radius:20px;padding:7px 14px}
.sim{position:fixed;right:0;top:0;bottom:0;width:372px;z-index:55;background:#fff;border-left:2px solid var(--ink);display:flex;flex-direction:column;font-size:12px;box-shadow:-6px 0 24px rgba(0,0,0,.15);filter:grayscale(1)}
.sim .sh2{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--pend);color:var(--pendInk);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sim .sb2{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.sim h3{margin:0 0 4px;font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.sim .g{display:flex;flex-wrap:wrap;gap:5px}
.sim .btn{font-size:11px;padding:3px 8px}
.sim select{width:100%;border:1px solid #6B6B66;border-radius:5px;padding:5px 6px;font-size:12px;background:#fff}
.sim label.k{display:flex;gap:6px;align-items:center}
.insp{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px}
.insp b{font-family:'IBM Plex Mono',monospace}
.log{font:400 11px/1.35 'IBM Plex Mono',monospace;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:6px;background:var(--soft)}
.log div{padding:1px 0}
.sim .op{color:var(--pendInk)}
</style>
</head>
<body>
<div id="root"><div class="app" id="app">
<aside class="rail" id="rail" aria-label="Chat"></aside>
<main class="ctr" id="ctr"></main>
<div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Đổi độ rộng giữa chat và deck canvas" tabindex="0" title="Kéo để đổi độ rộng. Nhấp đúp để về mặc định." hidden></div>
<section class="dk" id="dk" aria-label="Deck canvas" hidden></section>
<section class="set" id="set" aria-label="Cài đặt Provider" hidden></section>
</div></div>
<div id="sim"></div>
<div id="dlg"></div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<input type="file" id="finput" multiple hidden accept=".txt,.md,.pdf,.docx,.png,.jpg,.jpeg,.pptx,.zip,.xlsx">
<script>
'use strict';
/* =====================================================================
   DeckAgent V1 · Prototype tương tác (mô phỏng UI, không chạy Agent Runtime)
   Nguồn: canvas "DeckAgent V1 UX Foundation" (Claude Design) + inventory,
   annotation và bảng case trong docs/design/UX-design.
   Mã trạng thái (R/C/D/M/H, UX02-T) chỉ hiện trong bảng mô phỏng, không hiện trong UI.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let _id = 0;
const nid = p => p + (++_id);
const ALLOWED = ['txt', 'md', 'pdf', 'docx', 'png', 'jpg', 'jpeg', 'pptx'];
const BUILTINS = ['OpenAI', 'Anthropic', 'Google Gemini', 'DeepSeek'];
const RESERVED_ID = '[provider ID của built-in]'; // giá trị thật chờ BR-005 V-6
const EFFORTS = ['Thấp', 'Vừa', 'Cao'];          // tên mức: chỗ giữ chỗ
const TM = { speed: 1 };
const SPEEDS = { slow: 1.8, normal: 1, fast: 0.01 };
const SVG = {

/* ---------- dừng và lỗi ---------- */
function slidesDone(ch) { return ch.deck.slides.filter(s => s.state === 'done').length; }

    else lines = ['Đã dừng thay đổi. Chưa slide nào được đổi; mọi slide giữ bản hoàn tất trước yêu cầu.'];

<script>
'use strict';
/* =====================  Render  ===================== */
let _built = false;
function ta() { return $('#ta'); }
function setTA(v) { const t = ta(); if (t) { t.value = v || ''; autosize(); } }
function focusTA() { const t = ta(); if (t) t.focus(); }
function autosize() { const t = ta(); if (!t) return; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }

function render() {
  if (!S) return;
  const st = S.ui.settings;
  $('#ctr').hidden = st; renderRail();
  if (st) { $('#dk').hidden = true; renderSettings(); } else { $('#set').hidden = true; renderCtr(); renderDeck(); }
  syncSplit(); renderSim(); renderDlg();
}
function renderLight() { renderChips(); renderNotes(); renderCbar(); renderQ(); renderSim(); }

/* ---------- rail ---------- */
function renderRail() {
  const c = cur(), blocked = !!S.req, open = S.ui.recents !== false;
  const others = S.chats.filter(x => x.id !== c.id && (!x.empty || x.draft.trim())).sort((a, b) => b.clock - a.clock);
  let h = '<div class="wm">DeckAgent</div>';
  h += '<button class="rnew' + (blocked ? ' dis' : '') + '" data-act="newchat" aria-disabled="' + blocked + '"><span class="rico" aria-hidden="true">+</span><span>Chat mới</span></button>';
  if (blocked) h += '<div class="hint" style="padding:0 10px">Dùng lại được khi yêu cầu kết thúc.</div>';
  if (S.notes.nav) h += '<div class="banner' + (S.notes.nav.kind === 'bad' ? ' bad' : '') + '" role="alert"><span>' + esc(S.notes.nav.text) + '</span><button class="x" data-act="dismissnav" aria-label="Đóng thông báo">' + SVG.x + '</button></div>';
  h += '<button class="rrec" data-act="recents" aria-expanded="' + open + '"><span>Gần đây</span>' + SVG.up.replace('M6 15l6-6 6 6', 'M6 9l6 6 6-6') + '</button>';
  if (open) {
    const item = (x, on) => {
      const name = x.empty && !x.draft.trim() ? 'Chat mới' : (x.empty ? 'Chat mới (có bản nháp)' : x.title);
      return '<button class="rit' + (on ? ' on' : '') + (blocked && !on ? ' off' : '') + '" data-act="openchat" data-id="' + x.id + '" title="' + esc(name) + '"' + (on ? ' aria-current="true"' : '') + (blocked && !on ? ' aria-disabled="true"' : '') + '>' + esc(name) + '</button>';
    };
    h += '<div class="rlist">' + item(c, true) + others.map(x => item(x, false)).join('') + '</div>';
    if (!others.length) h += '<div class="rempty"><b>Chưa có chat trước</b><br>Các chat bạn bắt đầu sẽ hiện ở đây sau khi bạn gửi yêu cầu đầu tiên.</div>';
  }
  $('#rail').innerHTML = h;
}

/* ---------- center ---------- */
function buildCtr() {
  $('#ctr').innerHTML = '<div class="tb" id="tb"></div><div class="cv" id="cv" role="log" aria-label="Hội thoại"></div>' +
    '<div class="dock" id="dock"><div id="dnotes" class="col" style="gap:8px"></div><div id="qc"></div>' +
    '<div class="cmp" id="cmp"><div class="chips" id="chips"></div><textarea id="ta" rows="2" aria-label="Yêu cầu" placeholder="Nhập hoặc dán yêu cầu của bạn…"></textarea><div class="cbar" id="cbar"></div></div><div class="hint" id="dhint"></div></div>';
  ta().addEventListener('input', () => { cur().draft = ta().value; S.notes.send = null; autosize(); renderLight(); });
  ta().addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); onSend(); } });
  _built = true;
}
function renderCtr() {
  if (!_built) buildCtr();
  const ch = cur();
  if (ta().value !== ch.draft) setTA(ch.draft);
  $('#tb').innerHTML = '<span>' + esc(ch.empty ? 'Chat mới' : ch.title) + '</span>';
  const cv = $('#cv');
  const nearBottom = cv.scrollHeight - cv.scrollTop - cv.clientHeight < 80;
  let h = '';
  if (ch.empty && !ch.messages.length) h = '<div class="empty-chat"><b>Hãy mô tả deck bạn muốn</b><span>Dán ghi chú hoặc ý tưởng, hoặc đính kèm tài liệu, ảnh. DeckAgent đề xuất outline trước. Chưa có slide nào được tạo cho đến khi bạn xác nhận outline.</span></div>';
  else {
    ch.messages.forEach(m => { h += msgHTML(m, ch); });
  }
  const r = S.req && S.req.chatId === ch.id ? S.req : null;
  if (r) {
    if (r.phase === 'waiting') h += '<div class="status" role="status"><span class="dot w"></span><span>Đang chờ câu trả lời của bạn</span></div>';
    else h += '<div class="status" role="status"><span class="dot"></span><span>' + esc(r.label) + ' · Đã chạy <span id="stat-tm" aria-hidden="true">' + fmtTime(Date.now() - r.t0) + '</span></span></div>';
  }
  cv.innerHTML = h;
  if (nearBottom || r) cv.scrollTop = cv.scrollHeight;
  renderChips(); renderNotes(); renderCbar(); renderQ();
}
function chipSent(f) { return '<span class="fc sent">' + SVG.file + '<span class="nm">' + esc(f.name) + '</span><span class="ty">' + esc(f.ty) + '</span></span>'; }
function outlineItemHTML(it) {
  let t = esc(it.text);
  if (it.tag === 'ph') t += ' <span class="mk2">Placeholder: doanh thu Q3 không có trong tài liệu</span>';
  if (it.tag === 'conflict') t += ' <span class="mk3">Chưa chốt: văn bản ghi 18%, bảng ghi 21%</span>';
  if (it.tag === 'new') t += ' <span class="tg">Mới</span>';
  return '<li><b>' + it.n + '</b><span>' + t + '</span></li>';
}
function msgHTML(m, ch) {
  switch (m.t) {
    case 'user': return '<div class="m-u">' + (m.text ? esc(m.text) : '') + (m.files && m.files.length ? '<div class="fl">' + m.files.map(chipSent).join('') + '</div>' : '') + '</div>';
    case 'sys': return '<div class="m-s">' + (m.label ? '<span class="lb">' + esc(m.label) + '</span>' : '') + m.lines.map(l => '<p>' + esc(l) + '</p>').join('') + '' + '</div>';
    case 'q': return '<div class="m-s"><p class="q">' + esc(m.text) + '</p></div>';
    case 'outline': {
      const v = m.ver;
      const label = m.cancelled ? 'Đề xuất outline ' + m.n + ' · đã hủy' : m.confirmed ? 'Đề xuất outline ' + m.n + ' · đã xác nhận' : m.cur ? 'Đề xuất outline ' + m.n + ' · hiện tại' : 'Đề xuất outline ' + m.n + ' · cũ, không còn là hiện tại';
      let h = '<div class="m-s' + (m.cur ? '' : ' old') + '"><span class="lb">' + esc(label) + '</span>';
      if (v.items.length) h += '<ol class="ol">' + v.items.map(outlineItemHTML).join('') + '</ol>';
      if (v.notes.length) h += '<div style="border-top:1px solid #D5D5CF;padding-top:6px;font-size:12.5px" class="col"><b>Ghi chú</b>' + v.notes.map(n => '<span>' + esc(n) + '</span>').join('') + '</div>';
      if (m.cur && !v.empty) h += '<b style="font-size:12.5px">Chưa có slide nào được tạo cho đến khi bạn xác nhận.</b>';
      return h + '</div>';
    }
    case 'outline-ok': {
      const building = S.req && S.req.kind === 'build' && S.req.chatId === ch.id;
      return '<div class="m-s"><span class="lb">Outline đã xác nhận</span><span style="font-size:12.5px">' + m.ver.items.map(i => i.n + ' ' + esc(i.text.split(':')[0])).join(' · ') + '</span><span class="hint">Chỉ đọc.' + (building ? ' Đang chuẩn bị slide từ outline này.' : '') + '</span></div>';
    }
    case 'notice': {
      let h = '<div class="m-n' + (m.kind === 'fail' ? ' bad' : '') + '" role="note"><h4>' + esc(m.title) + '</h4>' + m.lines.map(l => '<p>' + esc(l) + '</p>').join('');
      if (m.link) h += '<div class="acts"><button class="btn sm" data-act="opensettings">Mở Cài đặt model</button></div>';
      return h + '</div>';
    }
  }
  return '';
}
function renderChips() {
  const ch = cur(); let h = '';
  ch.files.forEach(f => {
    if (f.st === 'prep') h += '<span class="fc"><span class="spin" aria-label="Đang chuẩn bị"></span><span class="nm">' + esc(f.name) + '</span><span class="ty">' + esc(f.ty) + '</span><button class="fx" data-act="rmfile" data-id="' + f.id + '" aria-label="Gỡ ' + esc(f.name) + '">' + SVG.x + '</button></span>';
    else if (f.st === 'bad') h += '<span class="fc bad" title="' + esc(f.reason) + '">' + SVG.warn.replace('width="18" height="18"', 'width="14" height="14"') + '<span class="nm">' + esc(f.name) + '</span><span class="ty">' + esc(f.ty) + '</span><button class="fx" data-act="rmfile" data-id="' + f.id + '" aria-label="Gỡ ' + esc(f.name) + '">' + SVG.x + '</button></span>';
    else if (f.st === 'fail') h += '<span class="fc bad"><button class="fx" data-act="retry" data-id="' + f.id + '" aria-label="Thử lại tải lên ' + esc(f.name) + '">' + SVG.retry + '</button><span class="nm">' + esc(f.name) + '</span><span class="ty">' + esc(f.ty) + '</span><button class="fx" data-act="rmfile" data-id="' + f.id + '" aria-label="Gỡ ' + esc(f.name) + '">' + SVG.x + '</button></span>';
    else h += '<span class="fc">' + SVG.file + '<button class="nm" data-act="preview" data-id="' + f.id + '">' + esc(f.name) + '</button><span class="ty">' + esc(f.ty) + '</span><button class="fx" data-act="rmfile" data-id="' + f.id + '" aria-label="Gỡ ' + esc(f.name) + '">' + SVG.x + '</button></span>';
  });
  const pv = ch.files.find(f => f.id === S.ui.preview);
  if (pv) h += '<div class="dkn" style="flex-basis:100%">' + (pv.img && pv.url ? '<img alt="' + esc(pv.name) + '" src="' + pv.url + '" style="max-width:160px;max-height:100px">' : 'Không có bản xem trước cho loại file này.') + ' <button class="btn sm ghost" data-act="preview" data-id="' + pv.id + '">Đóng</button></div>';
  $('#chips').innerHTML = h; $('#chips').hidden = !h;
}
function renderNotes() {
  const ch = cur(); let h = '';
  const ms = modelState(ch), sn = S.notes.send;
  if (ms === 'M4') h += '<div class="err" role="alert">' + SVG.warn + '<span>Model <b style="color:inherit;font-family:IBM Plex Mono,monospace">' + esc(ch.removedModel) + '</b> đã bị xóa khỏi danh sách đã thêm. Hãy chọn model khác cho chat này.' + (sn ? ' Chữ và tệp của bạn vẫn được giữ.' : '') + '</span><button class="btn sm" data-act="menu">Chọn model</button></div>';
  if (sn && ms === 'M1') h += '<div class="err" role="alert">' + SVG.warn + '<span>' + (sn.variant === 'nocfg' ? 'Chưa có provider configuration. Hãy thiết lập provider và thêm model trong Cài đặt model.' : 'Provider configuration đã lưu nhưng chưa có added model. Hãy thêm model trong Cài đặt model.') + ' Chữ và tệp của bạn vẫn được giữ.</span><button class="btn sm" data-act="opensettings">Mở Cài đặt model</button></div>';
  if (sn && ms === 'M2') h += '<div class="err" role="alert">' + SVG.warn + '<span>Đã có model khả dụng. Hãy chọn một model cho chat này trước khi gửi. Chữ và tệp của bạn vẫn được giữ.</span><button class="btn sm" data-act="menu">Chọn model</button></div>';
  S.notes.fileErr.forEach(e => { h += '<div class="err" role="alert">' + SVG.warn + '<span><b>Không thể thêm ' + esc(e.name) + '</b><br>' + esc(e.reason) + '</span><button class="x" data-act="dismisserr" data-id="' + e.id + '" aria-label="Đóng">' + SVG.x + '</button></div>'; });
  if (S.sim.limit && ch.draft.length > S.sim.limit) h += '<div class="err" role="alert">' + SVG.warn + '<span>Nội dung yêu cầu quá dài. Hãy rút ngắn nội dung rồi gửi lại.</span></div>';
  if (S.notes.hint) h += '<div class="err" role="alert">' + SVG.warn + '<span>' + esc(S.notes.hint) + '</span><button class="x" data-act="dismisshint" aria-label="Đóng">' + SVG.x + '</button></div>';
  $('#dnotes').innerHTML = h; $('#dnotes').hidden = !h;
  const r = S.req && S.req.chatId === ch.id ? S.req : null;
  $('#dhint').textContent = r ? (r.phase === 'waiting' ? 'Câu trả lời này sẽ tiếp tục yêu cầu hiện tại.' : 'Bạn có thể soạn yêu cầu tiếp theo. Hãy đợi yêu cầu hiện tại kết thúc trước khi gửi.') : '';
  $('#cmp').classList.toggle('over', !!(S.sim.limit && ch.draft.length > S.sim.limit));
}
function renderQ() {
  const ch = cur(), q = ch.pendingQ, r = S.req;
  const el = $('#qc');
  const show = q && ((q.kind === 'clarify' && r && r.chatId === ch.id && r.phase === 'waiting') || (q.kind === 'outline' && !r));
  if (!show) { el.innerHTML = ''; return; }
  let h = '<div class="qcard" role="group" aria-label="' + esc(q.title) + '"><div class="qt">' + esc(q.kind === 'outline' ? q.title : q.title) + '</div>';
  q.options.forEach((o, i) => { h += '<button class="qrow" data-act="pick" data-id="' + o.id + '"><span class="qn">' + (i + 1) + '</span>' + esc(o.label) + '</button>'; });
  if (q.skip) h += '<button class="qrow" data-act="skipq"><span class="qn">–</span>Bỏ qua câu hỏi này</button>';
  h += '<span class="qhint">' + esc(q.free) + (q.kind === 'outline' ? ' Chọn là gửi ngay; chữ và tệp chưa gửi vẫn ở lại khung nhập.' : '') + '</span></div>';
  el.innerHTML = h;
}
function renderCbar() {
  const ch = cur(), r = S.req && S.req.chatId === ch.id ? S.req : null, ms = modelState(ch);
  let h = '<div style="position:relative"><button class="plus" data-act="plus" aria-label="Đính kèm tệp hoặc ảnh" aria-expanded="' + S.ui.plus + '" style="' + (S.ui.plus ? 'background:#D9D9D3' : '') + '">+</button>';
  if (S.ui.plus) h += '<div class="pop plusp" role="menu"><button class="it" role="menuitem" data-act="attach">' + SVG.clip + '<span>Đính kèm tệp hoặc ảnh</span></button></div>';
  h += '</div><div class="pill" style="position:relative">';
  const label = ms === 'M3' ? '<span class="mid">' + esc(ch.sel.m) + '</span>' : (ms === 'M1' ? '<span>Chưa có model</span>' : '<span>Chọn model</span>');
  h += '<button class="mpick' + (ms === 'M4' ? ' warn' : '') + '" data-act="menu" aria-haspopup="dialog" aria-expanded="' + S.ui.menu + '" aria-label="Chọn model">' + label + SVG.up + '</button>';
  if (S.ui.menu) h += menuHTML(ch);
  if (r) {
    h += '<button class="snd stop" data-act="stop" aria-label="Dừng">■</button>';
    if (r.phase === 'waiting' && sendable(ch) === 'ok') h += '<button class="snd" data-act="send" aria-label="Gửi câu trả lời">↑</button>';
  } else {
    const ok = sendable(ch) === 'ok';
    h += '<button class="snd' + (ok ? '' : ' off') + '" data-act="send" aria-label="Gửi" aria-disabled="' + (!ok) + '">↑</button>';
  }
  h += '</div>';
  const oldT = $('.tabscroll'), tx = oldT ? oldT.scrollLeft : null;
  $('#cbar').innerHTML = h;
  const newT = $('.tabscroll');
  if (newT) { if (tx != null) newT.scrollLeft = tx; if (S.ui.tabReveal) { S.ui.tabReveal = false; const on = $('.chip.on', newT); if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } }
}
function menuHTML(ch) {
  const ps = S.providers;
  if (!ps.some(p => p.id === S.ui.menuTab)) S.ui.menuTab = ch.sel && provById(ch.sel.cfg) ? ch.sel.cfg : (ps[0] || {}).id;
  let h = '<div class="pop menu" role="dialog" aria-label="Chọn model"><div class="tabs"><div class="tabscroll" tabindex="0" role="tablist" aria-label="Cấu hình provider, cuộn ngang để xem thêm">';
  ps.forEach(p => { h += '<button class="chip' + (p.id === S.ui.menuTab ? ' on' : '') + '" role="tab" aria-selected="' + (p.id === S.ui.menuTab) + '" data-act="tab" data-id="' + p.id + '">' + esc(p.name) + '</button>'; });
  h += '</div><div class="tabfix"><button class="ib" data-act="addcfg" aria-label="Thêm provider">+</button><button class="ib" data-act="opensettings" aria-label="Thiết lập model" style="border:0">' + SVG.gear + '</button></div></div>';
  if (S.req && S.ui.menuBn) h += '<div class="bn"><span style="flex:1">Yêu cầu đang chạy: lựa chọn mới chỉ áp dụng cho yêu cầu kế tiếp, yêu cầu đang chạy giữ model của nó.</span><button style="border:0;background:transparent" data-act="menubn" aria-label="Đóng thông báo">' + SVG.x + '</button></div>';
  if (!ps.length) h += '<div class="mn">Chưa có provider configuration. Bấm bánh răng để thiết lập provider và thêm model.</div>';
  else {
    const p = provById(S.ui.menuTab);
    h += '<div class="mls' + (S.ui.eff ? ' effopen' : '') + '">';
    if (!p.models.length) h += '<div class="mn">Cấu hình này chưa có model. Bấm + để thêm model.</div>';
    p.models.forEach(m => {
      const on = ch.sel && ch.sel.cfg === p.id && ch.sel.m === m;
      h += '<div class="mi' + (on ? ' on' : '') + '"><button class="pk" data-act="pickmodel" data-cfg="' + p.id + '" data-m="' + esc(m) + '">' + (on ? '✓ ' : '') + esc(m) + '</button>';
      if (on) {
        h += '<span class="ew"><button class="eff" data-act="eff" aria-label="Chọn mức suy luận" aria-expanded="' + S.ui.eff + '">' + esc(ch.effort) + SVG.up + '</button>';
        if (S.ui.eff) h += '<div class="effm" role="menu"><div class="h">Mức suy luận</div>' + EFFORTS.map(e => '<div role="menuitem" data-act="seteff" data-e="' + e + '">' + (e === ch.effort ? '✓ ' : '') + e + '</div>').join('') + '</div>';
        h += '</span>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}

/* ---------- deck canvas ---------- */
function slideHTML(s, big) {
  let ph = '';
  if (s.note === 'ph') ph = '<span class="ph">[Cần bổ sung số liệu kết quả]</span>';
  if (s.note === 'conflict') ph = '<span class="ph">Chưa giải quyết: văn bản ghi 18%, bảng ghi 21%</span>';
  if (s.state === 'todo') return '<div class="sl todo"><h3>' + esc(s.title) + '</h3><span>Chưa tới.</span></div>';
  if (s.state === 'building') return '<div class="sl bld"><h3>' + esc(s.title) + '</h3><span>Đang tạo…</span></div>';
  return '<div class="sl"><h3>' + esc(s.title) + '</h3><ul>' + s.bullets.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>' + ph + '</div>';
}
function renderDeck() {
  const dk = $('#dk'), ch = cur(), slides = ch.deck.slides;
  if (!slides.length) { dk.hidden = true; dk.innerHTML = ''; return; }
  dk.hidden = false;
  const done = slides.filter(s => s.state === 'done').length, r = S.req && S.req.chatId === ch.id ? S.req : null;
  const sel = ch.deck.sel != null && slides[ch.deck.sel] ? ch.deck.sel : null;
  let h = '<div class="hd"><b>Deck canvas</b><span class="hint">' + (done < slides.length ? 'Đã xong ' + done + '/' + slides.length + ' slide' : slides.length + ' slide') + '</span></div>';
  if (!done) h += '<div class="dkn">' + (r ? 'Outline đã xác nhận. Đang làm việc: chưa có slide nào hoàn tất.' : 'Chưa có slide nào hoàn tất. Outline đã xác nhận được giữ.') + '</div>';
  if (sel != null) {
    h += slideHTML(slides[sel], true);
