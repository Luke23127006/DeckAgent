    .outline-card h3{margin:0 0 5px;font-size:17px}.outline-card .subtitle{color:#647167;font-size:12px;margin-bottom:11px}.outline-card ol{margin:0 0 10px;padding-left:22px}.outline-card li{padding:3px 0}.tag{display:inline-block;border:1px solid #d5dcd4;background:#f1f4ef;border-radius:6px;padding:2px 6px;font-size:11px;color:#526254;margin-left:6px}.tag.warn{background:#fff1da;border-color:#ead5b0;color:#7a582b}.outline-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
    .primary{background:#285947!important;color:#fff!important;border-color:#285947!important}.outline-actions button,.secondary{background:#fff;border:1px solid #cbd4c9;border-radius:8px;padding:8px 11px;color:#294037}
    .composer-wrap{padding:14px 22px 19px;border-top:1px solid #edf0ea;background:#fff}.composer{max-width:820px;margin:auto;border:1px solid #cfd8ce;box-shadow:0 3px 16px #163d2510;border-radius:18px;padding:12px}.composer textarea{resize:none;width:100%;min-height:58px;max-height:150px;border:0;outline:0;color:#253128;background:transparent}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.composer-controls{display:flex;align-items:center;gap:6px}.icon-button{border:0;background:transparent;border-radius:50%;width:32px;height:32px;font-size:20px;color:#47624f}.icon-button:hover{background:#edf2ec}.model-select{border:0;background:#f0f3ef;border-radius:8px;padding:7px;color:#3b5343;max-width:210px}.send{border:0;background:#285947;color:#fff;border-radius:50%;width:34px;height:34px;font-size:17px}.stop{background:#9a514a}.composer-help{max-width:820px;margin:7px auto 0;color:#657369;font-size:11px;min-height:15px}.attachment-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}.attachment{display:flex;gap:7px;align-items:center;border:1px solid #cdd8cc;border-radius:8px;background:#f7faf6;padding:5px 6px;font-size:11px}.attachment.bad{border-color:#d8aaa6;background:#fff6f5}.attachment.wait{border-color:#e5cca7;background:#fffaf0}.attachment button{border:0;background:transparent;color:#7d3f3b;font-weight:700}.composer-error{font-size:12px;color:#9b3f3c;margin:6px 0 0}
    .deck{width:40%;min-width:340px;max-width:650px;display:flex;flex-direction:column;background:#f8f9f7;border-left:1px solid #dfe4dc}.deck[hidden]{display:none}.deck-top{height:60px;padding:0 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e7de}.deck-top strong{font-size:15px}.deck-top small{color:#69766a}.deck-body{min-height:0;flex:1;display:flex;flex-direction:column;padding:19px;gap:14px}.slide{flex:1;min-height:220px;max-height:410px;background:#fff;border:1px solid #cbd5c9;box-shadow:0 4px 18px #183a3211;border-radius:4px;padding:32px;display:flex;flex-direction:column;justify-content:space-between}.slide h2{font-family:Georgia,serif;font-weight:400;font-size:27px;line-height:1.25;margin:0}.slide p{color:#516153;line-height:1.6}.slide .image-placeholder{height:90px;border:1px dashed #adbaab;display:grid;place-items:center;color:#7c8a7b}.slide.pending{display:grid;place-items:center;border-style:dashed;color:#6c776c;box-shadow:none;background:#fafbf9}.slide-nav{display:flex;justify-content:space-between;align-items:center}.slide-nav button{background:#fff;border:1px solid #cbd5c9;border-radius:7px;padding:7px 10px}.thumbnails{display:flex;gap:7px;flex-wrap:wrap}.thumb{border:1px solid #bfcabc;background:#fff;border-radius:6px;padding:9px 11px;font-size:12px}.thumb.selected{outline:2px solid #295d46}.thumb.pending{border-style:dashed;color:#879187}.deck-foot{font-size:11px;color:#788578;border-top:1px solid #e1e7de;padding:13px 19px}

    .settings .model-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #e4e9e2;padding:7px 0;font-size:12px}.settings .model-row button{border:1px solid #cbd5ca;border-radius:6px;background:#fff;padding:4px 7px}.settings .model-add{display:flex;gap:7px;align-items:end}.settings .model-add label{flex:1}.settings .model-add button{height:34px}.status-card ul,.notice-card ul{margin:8px 0;padding-left:21px}.question-options{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.question-options button{background:#fff;border:1px solid #cbd4c9;border-radius:8px;padding:8px 11px;color:#294037}
    @media(max-width:940px){.app{height:auto;min-height:calc(100vh - 126px);flex-wrap:wrap}.rail{width:180px}.conversation{min-height:610px}.deck{width:100%;max-width:none;min-height:500px;border-left:0;border-top:1px solid #dfe4dc}.settings-grid{grid-template-columns:1fr}}
    @media(max-width:630px){.rail{width:100%;height:auto}.rail .chat-items{display:flex;gap:5px;overflow:auto}.rail .chat-items button{min-width:130px}.conversation{min-width:100%}.messages{padding:16px}.chat-top{padding:0 15px}.testbar{padding:12px}.meta{padding:8px 12px}.meta .desc{width:100%;margin-left:0}}
  </style>
</head>
<body>
  <header class="testbar" aria-label="Bộ điều khiển kiểm thử prototype">
    <strong>UX Prototype</strong><small>Mô phỏng cục bộ · không gọi model, không lưu file</small>
    <label>State <select id="statePicker" aria-label="Chọn UI state"></select></label>
    <label id="variantLabel" hidden>Biến thể <select id="variantPicker" aria-label="Chọn biến thể UI state"></select></label>
    <div class="test-actions">
      <button id="advanceBtn" type="button">Tiến bước</button>
      <button id="askBtn" type="button">Hỏi làm rõ</button>
      <button id="failBtn" type="button">Giả lập lỗi</button>
      <button id="reloadBtn" type="button">Giả lập reload</button>
      <button id="restartBtn" type="button">Giả lập DeckAgent dừng</button>
    </div>
    <span class="test-note">Bộ điều khiển phía trên chỉ để kiểm tra các trạng thái. Câu chữ và dữ liệu slide là ví dụ, không phải kết quả Agent Runtime.</span>
  </header>
  <div id="meta" class="meta"></div>
  <div class="app">
    <aside id="rail" class="rail"></aside>
    <main class="conversation">
      <div id="chatTop" class="chat-top"></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="composer" class="composer-wrap"></div>
    </main>
    <section id="deck" class="deck" aria-label="Deck canvas" hidden></section>
  </div>
  <div id="overlay"></div>
  <input id="fileInput" type="file" multiple hidden>
  <script>
    const stateGroups = {
      R: [['R1','Idle'],['R2','Request đang chạy'],['R3','Chờ làm rõ'],['R4','Chờ xác nhận outline'],['R4a','Outline rỗng'],['R5','Đang tạo hoặc đổi slide'],['R6','Completed'],['R7','Stopped'],['R8','Failed']],
      C: [['C1','Request area rỗng'],['C2','Draft có nội dung'],['C3','Attachment đang chuẩn bị'],['C4','Attachment bị từ chối'],['C5','Text quá dài'],['C6','Draft kế tiếp khi active']],
      D: [['D1','Chưa có slide'],['D2','Đã xác nhận outline, chưa có slide'],['D3','Có slide hoàn tất một phần'],['D4','Deck đầy đủ / follow-up xong'],['D5','Follow-up đang sửa'],['D6','Outline thiếu hoặc mâu thuẫn']],
      M: [['M1','Không có model chọn được'],['M2','Chat chưa chọn model'],['M3','Model đã chọn'],['M4','Model bị xóa'],['M5','Models settings'],['M6','Lỗi trong settings']],
      H: [['H1','Không có chat cũ'],['H2','Danh sách chat cũ'],['H3','Mở chat cũ'],['H4','Không mở được chat'],['H5','Tạo chat mới'],['H6','Đổi chat bị chặn'],['H7','Reload khi DeckAgent còn chạy'],['H8','Mở lại sau khi DeckAgent dừng']]
    };
    const stateInfo = {
      R1:['W1, W7','UC-012 · UC-003 · FR-053'],R2:['W1, W4, W8','UC-003 S2–S3 · FR-012, FR-018'],R3:['W3, W8','UC-003 A38 · FR-020, FR-054'],R4:['W3','UC-001 S3–S4 · FR-001, FR-003'],R4a:['W3','UC-001 A24 · FR-006'],R5:['W4, W8','UC-001 S5 · UC-002 S3 · FR-023, FR-029'],R6:['W4, W8','UC-001 S6 · UC-002 S4 · FR-024, FR-029'],R7:['W1, W4, W8','UC-003 A31 · FR-018, FR-025'],R8:['W1, W4, W8','UC-003 A11/A18/A19 · FR-019, FR-026'],
      C1:['W1','UC-003 A6 · FR-015'],C2:['W1, W2','UC-003 S1 · FR-015'],C3:['W2','UC-003 A3 · FR-016'],C4:['W2','UC-003 A8 · FR-017'],C5:['W2','UC-003 S1 · FR-015 · BR-002 pending'],C6:['W2, W4','UC-003 A14 · FR-014'],
      D1:['W1, W3, W7','UC-001 S3 · UC-012 S2 · FR-001, FR-051, FR-053'],D2:['W4','UC-001 S4–S5 · FR-023'],D3:['W4, W8','UC-001 S5 · FR-023, FR-025'],D4:['W4, W8','UC-001 S6 · UC-002 S4 · FR-023, FR-027, FR-029'],D5:['W8','UC-002 S3 · FR-027, FR-029'],D6:['W3','UC-001 A33/A34 · FR-010, FR-037'],
      M1:['W1, W5','UC-003 A17 · FR-046'],M2:['W1, W2','UC-003 A40 · FR-056'],M3:['W1, W2','UC-003 A27 · FR-055'],M4:['W1, W5','UC-003 A41 · FR-065'],M5:['W5, W6','UC-005 MF · FR-038–FR-044'],M6:['W5, W6','UC-005 A5/A7/A10/A12 · FR-045, FR-064'],
      H1:['W7','UC-006 A1 · FR-048'],H2:['W7','UC-006 S1 · FR-048'],H3:['W7 → W1/W3/W8','UC-006 S2–S3 · FR-049'],H4:['W7','UC-006 A3 · FR-050'],H5:['W1, W7','UC-012 MF · FR-053'],H6:['W4, W7','UC-006 S1 · UC-012 S1 · FR-054'],H7:['W1/W3/W4/W8','UC-003 A13 · FR-068'],H8:['W4, W7, W8','UC-006 A6 · FR-052']
    };
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const activeStages = new Set(['running-outline','clarification','building-zero','building-partial','followup-running']);
    const slideTitles = ['Trang bìa','Kết quả chính','Phân tích khu vực','Chi phí','Bước tiếp theo','Phụ lục','Rủi ro'];
    const acceptedTypes = new Set(['txt','md','pdf','docx','png','jpg','jpeg','pptx']);
    const variants = {
      R3:[['audience','Thiếu đối tượng'],['topic','Chưa biết chủ đề'],['scope','Follow-up: phạm vi'],['scope-new','Follow-up: có slide mới'],['outline-intent','Ý định outline chưa rõ'],['material-major','Thiếu material quan trọng'],['feedback','Feedback chưa rõ'],['image','Chọn hướng dùng ảnh'],['repeat','Trả lời vẫn mơ hồ']],
      R7:[['outline','Dừng trước outline'],['answer','Dừng khi chờ trả lời'],['zero','Dừng trước slide đầu'],['partial','Dừng giữa build'],['followup','Dừng giữa follow-up'],['unknown','Không rõ tiến độ']],
      R8:[['outline','Lỗi trước outline'],['zero','Lỗi trước slide đầu'],['partial','Lỗi giữa build'],['followup','Lỗi giữa follow-up'],['unknown','Không rõ tiến độ'],['key','API key bị từ chối'],['model','Model bị từ chối'],['limit','Usage limit'],['image','Ảnh bắt buộc thất bại']],
      R6:[['complete','Hoàn tất deck'],['kept','Giữ instruction cho sau'],['invalid-number','Slide không tồn tại'],['invalid-title','Số/title không khớp'],['material-minor','Dùng một phần material'],['image-optional','Ảnh tùy chọn thất bại']],
      C2:[['draft','Draft hợp lệ'],['no-preview','File ready, không có preview']],
      R4:[['current','Current outline'],['stale','Option của outline cũ']],
      H7:[['running','Reload khi đang chạy'],['answer','Reload khi chờ trả lời']]
    };
    const variantSources = {
      R3:{topic:'UC-001 A32 · FR-020, FR-021',scope:'UC-002 A1–A4 · FR-030, FR-032–FR-034', 'scope-new':'UC-002 A1–A4 · FR-030, FR-032–FR-034','outline-intent':'UC-001 A39 · FR-007, FR-020','material-major':'UC-003 A43 · FR-067, FR-020',feedback:'UC-002 A6/A10 · FR-031, FR-035',image:'UC-001 A42 · UC-002 A12 · FR-066',repeat:'UC-003 A38 · FR-020'},
      R7:{outline:'UC-001 A10 · FR-018, FR-025',answer:'UC-003 A31/A38 · FR-018, FR-020',zero:'UC-001 A10 · FR-025',followup:'UC-002 A7 · FR-025, FR-028',unknown:'UC-003 A31 · FR-025, FR-026'},
      R8:{outline:'UC-001 A11 · FR-019, FR-026',zero:'UC-001 A11 · FR-025, FR-026',followup:'UC-002 A11 · FR-025, FR-026',unknown:'UC-003 A11 · FR-025, FR-026',key:'UC-003 A18 · FR-019, FR-043',model:'UC-003 A18 · FR-019, FR-043',limit:'UC-003 A19 · FR-019',image:'UC-001 A42 · UC-002 A12 · FR-066'},
      R6:{kept:'UC-002 A4 · FR-034','invalid-number':'UC-002 A5 · FR-036','invalid-title':'UC-002 A5 · FR-036','material-minor':'UC-003 A43 · FR-067','image-optional':'UC-001 A42 · UC-002 A12 · FR-066'},C2:{'no-preview':'UC-003 A3 · FR-016'},R4:{stale:'UC-001 A23 · FR-013'},H7:{answer:'UC-003 A13 · FR-068'}
    };
    let demo;
    let chatStates = new Map();
    let modelSelectionHistory = [];
    let currentChat = 'new';
    let nextChatNumber = 1;

    function base(){return {state:'R1',stage:'idle',model:'[model ID A]',modelMode:'ready',modelAtStart:'[model ID A]',providerAtStart:'anthropic',draft:'',attachments:[],messages:[],deck:false,slidesDone:0,slideCount:6,slideIndex:0,followup:false,followupScope:'specific',scopeRequestedNew:false,keptInstruction:'',outlineIntentPending:false,materialLimit:'',outlineVersion:1,outlineKind:'normal',outlineStatus:null,settings:false,settingsError:'',settingsInfo:'',settingsView:'main',settingsProvider:0,keySaved:true,notice:'',historyMode:'list',chatTitle:'Chat mới',elapsed:'01:42',focus:'',textTooLong:false,clarificationKind:'audience',progressKnown:true,failureReason:'general',stopOrigin:'partial',providers:[{name:'Work Anthropic',id:'anthropic',builtIn:true,keySaved:true,models:['[model ID A]','[model ID B]']},{name:'Personal OpenAI',id:'openai',builtIn:true,keySaved:true,models:['[model ID C]']}]};}
    function sampleRequest(){return {role:'user',text:'Làm deck ngắn gọn từ báo cáo Q3 cho hội đồng.'};}
    function sampleFollowup(){return {role:'user',text:'Rút gọn slide 3 và thêm một slide về rủi ro sau slide 4.'};}
    function configure(id){
      const d=base();d.state=id;
      const outline=()=>{d.stage='outline';d.messages=[sampleRequest()];d.outlineStatus='proposed';d.chatTitle='Đánh giá doanh số Q3';};
      const running=()=>{d.stage='running-outline';d.messages=[sampleRequest()];d.chatTitle='Đánh giá doanh số Q3';};
      const building=(done=0)=>{d.stage=done?'building-partial':'building-zero';d.messages=[sampleRequest(),{role:'user',text:'Xác nhận outline và tạo slide.'}];d.outlineStatus='confirmed';d.deck=true;d.slidesDone=done;d.chatTitle='Đánh giá doanh số Q3';};
       const complete=()=>{building(6);d.stage='completed';d.messages.push({role:'assistant',text:firstDraftClosing()});};
      const followup=(done=false)=>{complete();d.messages.push(sampleFollowup());d.followup=true;d.slideCount=7;d.slideIndex=2;if(done){d.stage='followup-completed';d.slidesDone=7;d.messages.push({role:'assistant',text:'Đã rút gọn slide 3 “Phân tích khu vực” và thêm slide 5 “Rủi ro” sau slide 4. Mình không đổi slide nào khác.'});}else{d.stage='followup-running';d.slidesDone=6;}};
      switch(id){
        case 'R2':running();break;
         case 'R3':running();d.stage='clarification';d.clarificationKind='audience';d.messages.push({role:'assistant',text:clarificationPrompt('audience')});break;
        case 'R4':outline();break;
        case 'R4a':outline();d.outlineKind='empty';break;
        case 'R5':building(4);break;
        case 'R6':complete();break;
         case 'R7':building(3);d.stage='stopped';d.stopOrigin='partial';break;
         case 'R8':building(3);d.stage='failed';d.failureReason='general';break;
        case 'C2':d.draft='Làm deck 6 slide về kết quả Q3.';break;

    function firstDraftClosing(){return 'Bản nháp đã sẵn sàng. Slide 1: trang bìa và mục tiêu. Slide 2: kết quả chính; doanh thu Q3 là placeholder. Slide 3: phân tích khu vực; hai nguồn có số liệu mâu thuẫn nên chưa chọn một số. Slide 4: chi phí. Slide 5: bước tiếp theo. Slide 6: phụ lục. Giả định: deck dành cho hội đồng theo yêu cầu. Nội dung bổ sung ngoài tài liệu: câu nối và tiêu đề tóm tắt. Chưa kiểm tra: số liệu doanh thu Q3 và chênh lệch giữa hai nguồn khu vực.';}
    function clarificationPrompt(kind){return ({audience:'Deck này dành cho đối tượng nào? Câu trả lời sẽ tiếp tục yêu cầu hiện tại.',topic:'Bạn muốn deck trình bày chủ đề gì? Mình cần biết chủ đề trước khi đề xuất outline.',scope:'Bạn muốn áp dụng thay đổi này cho những slide nào?', 'scope-new':'Bạn muốn áp dụng thay đổi này cho những slide nào, kể cả slide mới?','outline-intent':'Bạn muốn xác nhận outline hiện tại, hủy, sửa, hay dùng lại đề xuất 1? Chưa có thay đổi nào được áp dụng.','material-major':'Mình chỉ đọc được trang 1–11 của report.pdf; trang 12–20 có kết quả thử nghiệm chưa được dùng. Bạn có thể gửi lại phần này hoặc đổi yêu cầu không?',feedback:'Mình chưa xác định được điều cần sửa. Bạn muốn thay đổi nội dung nào?',image:'Bạn muốn dùng ảnh đính kèm hay tạo ảnh mới cho phần này?',repeat:'Câu trả lời trước vẫn chưa đủ rõ để tiếp tục. Bạn có thể mô tả cụ thể hơn không?'})[kind];}

    function applyVariantToDemo(id,variant){if(id==='R3'){

        if(variant==='outline-intent'){demo.outlineStatus='proposed';demo.outlineVersion=2;demo.outlineIntentPending=true;demo.messages=[sampleRequest(),{role:'assistant',text:'Đề xuất outline 1 vẫn ở conversation.'},{role:'user',text:'OK?'},{role:'assistant',text:clarificationPrompt(variant)}];}
        if(variant==='material-major'){demo.messages=[{role:'user',text:'Làm deck từ report.pdf về kết quả thử nghiệm.'},{role:'assistant',text:clarificationPrompt(variant)}];demo.materialLimit='report.pdf: trang 12–20 chưa dùng';}
      }else if(id==='R7'||id==='R8'){

      }else if(id==='C2'&&variant==='no-preview'){demo.attachments=[{name:'bao-cao.docx',status:'ready'}];}

      else if(id==='R6'&&variant==='invalid-number'){demo.followup=true;demo.messages.push({role:'user',text:'Rút ngắn slide 9.'},{role:'assistant',text:'Không tìm thấy slide 9; deck hiện có 6 slide. Chưa thay đổi slide nào. Hãy gửi request mới với tham chiếu đúng.'});}
      else if(id==='R6'&&variant==='invalid-title'){demo.followup=true;demo.messages.push({role:'user',text:'Rút ngắn slide 3, Chi phí.'},{role:'assistant',text:'Số slide 3 và title “Chi phí” chỉ hai slide khác nhau (slide 3: Phân tích khu vực; slide 4: Chi phí). Deck hiện có 6 slide. Chưa thay đổi slide nào.'});}
      else if(id==='R6'&&variant==='material-minor'){demo.followup=true;demo.slideCount=7;demo.slidesDone=7;demo.stage='followup-completed';demo.messages.push(sampleFollowup(),{role:'assistant',text:'Đã thêm slide mới về rủi ro. Mình chỉ dùng một phần material trước đó trong chat và không dùng hết phần còn lại; không nhận đã dùng toàn bộ. Slide ngoài phạm vi yêu cầu giữ nguyên.'});}

    function rememberModelSelection(){if(!demo.model)return;const provider=demo.providers.find(p=>p.models.includes(demo.model));if(provider)modelSelectionHistory.push({providerId:provider.id,model:demo.model});}
    function forgetModelSelections(providerId,model){modelSelectionHistory=modelSelectionHistory.filter(entry=>entry.providerId!==providerId||(model&&entry.model!==model));}
    function latestSelectableModel(providers){for(let i=modelSelectionHistory.length-1;i>=0;i--){const selected=modelSelectionHistory[i];if(providers.some(p=>p.id===selected.providerId&&p.models.includes(selected.model)))return selected.model;}return '';}
    function saveCurrentChat(){demo.attachments=[];demo.settings=false;chatStates.set(currentChat,demo);}
    function setState(id,variant){updateVariantPicker(id);const selected=variant||variantOptions(id)[0]?.[0]||'';$('variantPicker').value=selected;demo=configure(id);applyVariantToDemo(id,selected);chatStates=new Map();modelSelectionHistory=[];nextChatNumber=1;currentChat=demo.chatTitle==='Chat mới'?'new':'sales';rememberModelSelection();$('statePicker').value=id;render();}

    function renderMeta(){const [wireframe,source]=stateInfo[demo.state];const title=Object.values(stateGroups).flat().find(x=>x[0]===demo.state)?.[1]||demo.state;const selected=$('variantPicker').value;const variant=variantOptions(demo.state).find(([value])=>value===selected)?.[1];const cited=variantSources[demo.state]?.[selected]||source;$('meta').innerHTML=`<span class="id-pill">${esc(demo.state)}</span><b>${esc(title)}</b>${variant?`<span class="source-pill">Biến thể: ${esc(variant)}</span>`:''}<span class="source-pill">Nền ${esc(wireframe)}</span><span class="source-pill">${esc(cited)}</span><span class="desc">State đang mô phỏng · chọn ID khác ở thanh trên</span>`;}
    function renderRail(){const locked=active();let history='';if(demo.historyMode==='empty'){history='<div class="hint">Chưa có chat trước. Các chat đã gửi yêu cầu sẽ hiện ở đây.</div>';}else{const entries=[['sales',chatStates.get('sales')?.chatTitle||'Đánh giá doanh số Q3',chatStates.get('sales')?.deck??true,chatStates.get('sales')?.lastModified||'hôm nay 09:30'],['thesis',chatStates.get('thesis')?.chatTitle||'Dàn ý bảo vệ luận văn',chatStates.get('thesis')?.deck??false,chatStates.get('thesis')?.lastModified||'hôm qua 16:10']];for(const [id,chat] of chatStates)if(id.startsWith('new-')&&chat.messages.length)entries.push([id,chat.chatTitle,chat.deck,chat.lastModified||'trong phiên này']);if(currentChat.startsWith('new-')&&demo.messages.length&&!chatStates.has(currentChat))entries.push([currentChat,demo.chatTitle,demo.deck,demo.lastModified||'trong phiên này']);history=`<div class="chat-items">${entries.map(([id,title,hasDeck,modified])=>`<button data-chat="${esc(id)}" ${locked?'disabled':''} class="${currentChat===id?'selected':''}">${esc(title)}<small>Thay đổi gần nhất: ${esc(modified)} · ${hasDeck?'Có slide':'Chưa có slide'}</small></button>`).join('')}</div>`;}
      $('rail').innerHTML=`<div class="brand">DeckAgent</div><button class="new-chat" id="newChat" ${locked?'disabled':''}>＋ Chat mới</button><div><div class="rail-heading">Các chat trước</div>${history}</div><div class="hint">${locked?'Yêu cầu đang hoạt động: chưa thể đổi hoặc tạo chat.':'Mỗi chat chứa một deck. Chọn chat để mở lại mà không gửi request.'}</div>`;
      $('newChat').addEventListener('click',newChat);$('rail').querySelectorAll('[data-chat]').forEach(btn=>btn.addEventListener('click',()=>openChat(btn.dataset.chat)));
    }
    function renderTop(){$('chatTop').innerHTML=`<b>${esc(demo.chatTitle)}</b><small>${active()?'Yêu cầu đang hoạt động':demo.stage==='outline'?'Đang chờ quyết định về outline':'Sẵn sàng'}</small>`;}
    function renderOutline(){if(!demo.outlineStatus)return '';const empty=demo.outlineKind==='empty';const canceled=demo.outlineStatus==='canceled';const confirmed=demo.outlineStatus==='confirmed';let items=empty?'<p>Outline này chưa có nội dung để xác nhận. Hãy yêu cầu sửa outline.</p>':`<ol><li>Trang bìa: Đánh giá doanh số Q3</li><li>Kết quả chính <span class="tag warn">Placeholder: doanh thu Q3</span></li><li>Phân tích khu vực <span class="tag warn">18% / 21% chưa chốt</span></li><li>Chi phí</li><li>Bước tiếp theo</li><li>Phụ lục</li></ol><p>Hai phần tài liệu không khớp; hệ thống không chọn một số liệu làm chắc chắn. Có thể xác nhận khi điểm này còn mở; slide sẽ ghi là chưa giải quyết.</p>`;

    }
    function clarificationOptions(){switch(demo.clarificationKind){
      case 'topic':return [];

    function stopDetails(){if(!demo.progressKnown)return demo.followup?'Đã dừng thay đổi. Không xác định được số slide đã đổi; slide hoàn tất trước đó được giữ.':'Đã dừng yêu cầu. Không xác định được số slide đã hoàn tất.';

    function renderStatus(){switch(demo.stage){

      case 'followup-running':return `<div class="status-card"><div class="status-head">● Đang chỉnh deck</div><p>${demo.followupScope==='all'?'Đang thay mọi slide hiện có'+(demo.scopeRequestedNew?' và tạo slide mới':'')+'.':demo.followupScope==='new-only'?'Chỉ đang tạo slide mới. Mọi slide hiện có giữ nguyên.':demo.keptInstruction&&demo.scopeRequestedNew?'Đang tạo slide mới theo chỉ dẫn đã giữ. Slide hiện có không tự đổi theo chỉ dẫn đó.':'Đang sửa slide 3 và tạo slide mới sau slide 4. Các slide ngoài phạm vi giữ nguyên.'}</p><small>Đã chạy ${esc(demo.elapsed)} · Không tạo outline mới</small></div>`;

    function sendAllowed(){if(active()&&demo.stage!=='clarification')return false;if(demo.stage!=='clarification'&&(demo.modelMode!=='ready'||!demo.model))return false;if(demo.textTooLong)return false;if(demo.attachments.some(a=>a.status!=='ready'))return false;return !!demo.draft.trim()||demo.attachments.length>0;}

    function renderDeck(){const el=$('deck');el.hidden=!deckVisible();if(el.hidden)return;let count=demo.slidesDone;let n=Math.min(demo.slideIndex,Math.max(0,count-1));demo.slideIndex=n;const titles=count>slideTitles.length?['Trang bìa','Kết quả chính','Phân tích khu vực','Chi phí','Rủi ro','Bước tiếp theo','Phụ lục']:slideTitles;let slide=count?`<div class="slide"><div><small>SLIDE ${n+1}</small><h2>${esc(titles[n]||'Slide mới')}</h2></div><p>${n===1?'[Doanh thu Q3: placeholder]':n===2?'Tóm tắt kết quả theo khu vực. Số liệu mâu thuẫn được ghi là chưa giải quyết.':'Nội dung slide minh họa theo outline đã xác nhận.'}</p><div class="image-placeholder">Vùng nội dung / hình ảnh minh họa</div></div>`:'<div class="slide pending">Chưa có slide nào hoàn tất · đang chuẩn bị từ outline đã xác nhận</div>';let thumbs='';for(let i=0;i<demo.slideCount;i++)thumbs+=`<button class="thumb ${i===n&&i<count?'selected':''} ${i>=count?'pending':''}" data-slide="${i}" type="button" ${i>=count?'disabled':''}>${i+1} · ${i<count?'xong':'chờ'}</button>`;el.innerHTML=`<div class="deck-top"><strong>Deck canvas</strong><small>${count}/${demo.slideCount} slide hoàn tất</small></div><div class="deck-body">${slide}<div class="slide-nav"><button id="prevSlide" type="button" ${n<=0?'disabled':''}>← Trước</button><span>Slide ${count?n+1:0}/${demo.slideCount}</span><button id="nextSlide" type="button" ${n>=count-1?'disabled':''}>Sau →</button></div><div class="thumbnails">${thumbs}</div></div><div class="deck-foot">Chỉ để xem. Muốn thay đổi slide, hãy gửi request trong chat.</div>`;el.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>{demo.slideIndex=Number(b.dataset.slide);renderDeck();}));$('prevSlide').addEventListener('click',()=>{demo.slideIndex--;renderDeck();});$('nextSlide').addEventListener('click',()=>{demo.slideIndex++;renderDeck();});}

    function showAddProvider(){
      $('overlay').innerHTML=`<div class="settings-backdrop"><div class="settings" role="dialog" aria-modal="true" aria-label="Thêm cấu hình provider"><div class="settings-head"><div><h2>Thêm cấu hình provider</h2><p>W6 · UC-005 · Các trường API protocol và default models còn phụ thuộc quyết định của spec.</p></div><button id="backSettings" type="button">Quay lại</button></div><label>Provider<select id="newProvider"><option>Google Gemini</option><option>DeepSeek</option><option value="custom">Custom model API</option></select></label><label>Tên hiển thị<input id="newDisplayName" autocomplete="off" placeholder="Tên cấu hình, không trùng"></label><div id="customFields" hidden><label>Provider ID<input id="newProviderId" placeholder="ID duy nhất"></label><label>Base URL<input id="newBaseUrl" placeholder="https://example.invalid/v1"></label><label>API protocol <small>(danh sách hỗ trợ còn pending)</small><input id="newProtocol" placeholder="Nhập protocol để mô phỏng"></label></div><label>API key<input id="newKey" type="password" autocomplete="new-password" placeholder="Key từ tài khoản của bạn; custom có thể không cần"></label><p>Key đã lưu sẽ không được hiển thị lại. Bước thêm model có thể thực hiện sau khi lưu cấu hình.</p><div class="actions"><button id="saveProvider" class="primary" type="button">Lưu cấu hình</button><button id="cancelProvider" type="button">Hủy</button></div><div id="providerFeedback" class="error" role="status"></div></div></div>`;

    function render(){if($('statePicker').value!==demo.state){updateVariantPicker(demo.state);$('statePicker').value=demo.state;const variant=demo.state==='R3'?demo.clarificationKind:demo.state==='R7'?demo.stopOrigin:demo.state==='R8'?demo.failureReason:'';if(variant&&variantOptions(demo.state).some(([value])=>value===variant))$('variantPicker').value=variant;}renderMeta();renderRail();renderTop();renderMessages();renderComposer();renderDeck();renderOverlay();$('advanceBtn').disabled=!['running-outline','building-zero','building-partial','followup-running'].includes(demo.stage);$('askBtn').disabled=!['running-outline','followup-running'].includes(demo.stage);$('failBtn').disabled=!active();$('reloadBtn').disabled=!active();$('restartBtn').disabled=!active();}
    function sendRequest(){
      if(!sendAllowed())return;
      if(demo.stage==='clarification'){answerQuestion(demo.draft.trim()||`[Gửi lại ${demo.attachments.length} attachment]`);return;}
      if(demo.stage==='outline'){
        const content=demo.draft.trim()||`[Yêu cầu với ${demo.attachments.length} attachment]`;
        const text=content.toLowerCase();
        const asksRevision=/(thêm|sửa|đổi|bớt|dùng lại|quay lại)/.test(text);
        if(!asksRevision&&/^(xác nhận|confirm)/.test(text)){confirmOutline();return;}
        if(text==='hủy'||text.startsWith('hủy outline')){cancelOutline();return;}
        demo.messages.push({role:'user',text:content});demo.draft='';demo.attachments=[];
        demo.modelAtStart=demo.model;demo.providerAtStart=demo.providers.find(p=>p.models.includes(demo.model))?.id||null;
        if(asksRevision){
          demo.messages.push({role:'assistant',text:`Đề xuất outline ${demo.outlineVersion} (cũ) được giữ nguyên trong conversation.`});
          demo.outlineStatus=null;demo.outlineVersion++;demo.stage='running-outline';demo.state='R2';
        }else{
          demo.stage='clarification';demo.state='R3';demo.clarificationKind='outline-intent';demo.outlineIntentPending=true;
          demo.messages.push({role:'assistant',text:clarificationPrompt('outline-intent')});
        }
        render();return;
      }
      const content=demo.draft.trim()||`[Chỉ gửi ${demo.attachments.length} attachment]`;
      demo.messages.push({role:'user',text:content});demo.draft='';demo.attachments=[];
      demo.modelAtStart=demo.model;demo.providerAtStart=demo.providers.find(p=>p.models.includes(demo.model))?.id||null;
      demo.followup=deckVisible();demo.chatTitle=demo.chatTitle==='Chat mới'?content.slice(0,40):demo.chatTitle;demo.lastModified=new Date().toLocaleString('vi-VN');
      if(demo.followup&&/slide\s+9\b/i.test(content)){demo.stage='completed';demo.state='R6';demo.messages.push({role:'assistant',text:`Không tìm thấy slide 9; deck hiện có ${demo.slideCount} slide. Chưa thay đổi slide nào. Hãy gửi request mới với tham chiếu đúng.`});render();return;}
      if(demo.followup&&/slide\s+3\s*,\s*chi phí/i.test(content)){demo.stage='completed';demo.state='R6';demo.messages.push({role:'assistant',text:`Số slide 3 và title “Chi phí” chỉ hai slide khác nhau. Deck hiện có ${demo.slideCount} slide; chưa thay đổi slide nào.`});render();return;}
      if(demo.followup&&/trang trọng hơn/i.test(content)){demo.stage='clarification';demo.state='R3';demo.clarificationKind=/thêm slide/i.test(content)?'scope-new':'scope';demo.messages.push({role:'assistant',text:clarificationPrompt(demo.clarificationKind)});render();return;}
      if(demo.followup&&demo.keptInstruction&&/thêm slide/i.test(content)){demo.followupScope='new-only';demo.scopeRequestedNew=true;demo.slideCount=7;}
      else{demo.followupScope='specific';demo.scopeRequestedNew=false;}
      demo.stage=demo.followup?'followup-running':'running-outline';demo.state=demo.followup?'D5':'R2';render();
    }
    function answerQuestion(text,fromOption=false){
      if(!text.trim())return;
      demo.messages.push({role:'user',text});if(!fromOption)demo.draft='';
      const kind=demo.clarificationKind;
      if(kind==='outline-intent'){
        if(/xác nhận/i.test(text)){demo.outlineIntentPending=false;demo.outlineStatus='confirmed';demo.deck=true;demo.slidesDone=0;demo.stage='building-zero';demo.state='D2';}
        else if(/hủy/i.test(text)){demo.outlineIntentPending=false;demo.outlineStatus='canceled';demo.stage='completed';demo.state='R6';demo.messages.push({role:'assistant',text:'Đã hủy outline theo câu trả lời trong request hiện tại. Chưa tạo slide nào.'});}
        else if(/sửa|đề xuất 1|proposal|đầu tiên|first|trước/i.test(text)){demo.outlineIntentPending=false;demo.messages.push({role:'assistant',text:`Đề xuất outline ${demo.outlineVersion} được giữ nguyên trong conversation; đang chuẩn bị đề xuất mới theo câu trả lời.`});demo.outlineStatus=null;demo.outlineVersion++;demo.stage='running-outline';demo.state='R2';}
        else{demo.messages.push({role:'assistant',text:clarificationPrompt('outline-intent')});}
        render();return;
      }
      if(kind==='material-major'){
        if(/đổi yêu cầu/i.test(text)||(!fromOption&&demo.attachments.some(a=>a.status==='ready'))){demo.materialLimit='report.pdf: trang 12–20 chưa dùng';if(!fromOption)demo.attachments=[];demo.stage='running-outline';demo.state='R2';}
        else demo.messages.push({role:'assistant',text:'Hãy gửi lại phần kết quả thử nghiệm chưa đọc được, hoặc mô tả cách đổi yêu cầu. Chưa có outline proposal.'});
        render();return;
      }
      if(kind==='scope'||kind==='scope-new'){
        if(/giữ chỉ dẫn/i.test(text)){demo.keptInstruction='giọng trang trọng';demo.stage='completed';demo.state='R6';demo.messages.push({role:'assistant',text:'Đã giữ chỉ dẫn giọng trang trọng cho các slide tạo sau. Chưa thay đổi hoặc tạo slide nào bây giờ; slide hiện có giữ nguyên.'});render();return;}
        demo.followupScope=/mọi slide/i.test(text)?'all':/slide mới/i.test(text)?'new-only':'specific';
        demo.scopeRequestedNew=kind==='scope-new';if(demo.scopeRequestedNew)demo.slideCount=7;demo.stage='followup-running';demo.state='D5';render();return;
      }
      demo.stage=demo.followup?'followup-running':'running-outline';demo.state=demo.followup?'D5':'R2';render();
    }
    function confirmOutline(fromOption=false){if(demo.outlineKind==='empty'){setNotice('Outline chưa có nội dung để xác nhận. Hãy yêu cầu sửa outline.');return;}demo.messages.push({role:'user',text:'Xác nhận outline và tạo slide.'});if(!fromOption)demo.draft='';demo.modelAtStart=demo.model;demo.providerAtStart=demo.providers.find(p=>p.models.includes(demo.model))?.id||null;demo.outlineStatus='confirmed';demo.deck=true;demo.stage='building-zero';demo.state='D2';demo.slidesDone=0;demo.slideCount=6;render();}
    function cancelOutline(){demo.messages.push({role:'user',text:'Hủy outline.'});demo.outlineStatus='canceled';demo.stage='idle';demo.state='R1';demo.notice='Outline đã hủy. Không có slide nào được tạo; request sau có thể đề xuất outline mới.';render();}
    function advance(){switch(demo.stage){
      case 'running-outline':demo.stage='outline';demo.state='R4';demo.outlineStatus='proposed';if(demo.materialLimit)demo.messages.push({role:'assistant',text:`Chỉ dùng phần material đọc được. ${demo.materialLimit}. Không nhận đã dùng toàn bộ file.`});break;
      case 'building-zero':demo.stage='building-partial';demo.state='D3';demo.slidesDone=3;break;
      case 'building-partial':demo.stage='completed';demo.state='R6';demo.slidesDone=demo.slideCount;demo.messages.push({role:'assistant',text:firstDraftClosing()});break;
      case 'followup-running':
        demo.stage='followup-completed';demo.state='R6';demo.slidesDone=demo.slideCount;
        if(demo.followupScope==='all')demo.messages.push({role:'assistant',text:`Đã thay toàn bộ 6 slide hiện có theo instruction đã chọn${demo.scopeRequestedNew?' và tạo slide mới cùng instruction':''}. Không cần phê duyệt thêm; không tạo outline mới.`});
        else if(demo.followupScope==='new-only')demo.messages.push({role:'assistant',text:`Đã tạo slide mới${demo.keptInstruction?' theo chỉ dẫn '+demo.keptInstruction+' đã giữ từ request trước':''}. Không đổi bất kỳ slide hiện có nào.`});
        else demo.messages.push({role:'assistant',text:'Đã rút gọn slide 3 “Phân tích khu vực” và thêm slide 5 “Rủi ro” sau slide 4. Các slide ngoài phạm vi yêu cầu không đổi.'});
        break;
      default:return;
    }render();}
    function stopRequest(){if(!active())return;demo.stopOrigin=demo.stage==='running-outline'?'outline':demo.stage==='clarification'?'answer':demo.stage==='building-zero'?'zero':demo.stage==='followup-running'?'followup':'partial';demo.stage='stopped';demo.state='R7';demo.notice='';render();}
    function failRequest(){if(!active())return;demo.failureReason=demo.stage==='running-outline'?'outline':demo.stage==='building-zero'?'zero':demo.stage==='followup-running'?'followup':'partial';demo.stage='failed';demo.state='R8';demo.notice='';render();}
    function newChat(){if(active()){setNotice('Không thể tạo chat mới khi request đang hoạt động.');return;}const providers=demo.providers;saveCurrentChat();currentChat='new-'+nextChatNumber++;demo=base();demo.providers=providers;demo.model=latestSelectableModel(providers);demo.modelMode=demo.model?'ready':providers.some(p=>p.models.length)?'unselected':'none';demo.state='H5';render();}
    function openChat(chat){if(active()){setNotice('Không thể mở chat khác khi request đang hoạt động.');return;}if(chat===currentChat)return;if(chat!=='sales'&&chat!=='thesis'&&!chatStates.has(chat))return;const providers=demo.providers;saveCurrentChat();currentChat=chat;if(chatStates.has(chat)){demo=chatStates.get(chat);}else if(chat==='sales'){demo=configure('H3');}else{demo=configure('R4');demo.chatTitle='Dàn ý bảo vệ luận văn';demo.messages=[{role:'user',text:'Làm deck cho buổi bảo vệ luận văn.'}];}demo.providers=providers;demo.attachments=[];if(demo.model&&!providers.some(p=>p.models.includes(demo.model))){const removed=demo.model;demo.model='';demo.modelMode=providers.some(p=>p.models.length)?'removed':'none';demo.notice=`Model ${removed} đã bị xóa. Hãy chọn model khác cho chat này.`;}else if(!demo.model){if(demo.modelMode!=='removed')demo.modelMode=providers.some(p=>p.models.length)?'unselected':'none';}else{demo.modelMode='ready';demo.notice='Đã mở chat cũ: conversation, deck và selected model được giữ. Không gửi request mới.';}render();}
    function showPreview(index){const a=demo.attachments[index];const canPreview=/\.(txt|md|png|jpe?g)$/i.test(a.name);$('overlay').innerHTML=`<div class="preview-backdrop"><div class="preview" role="dialog" aria-modal="true"><h2>${esc(a.name)}</h2><p>${canPreview?'Bản prototype không đọc nội dung file thật; đây là vùng preview minh họa.':'Không có preview cho loại file này. File vẫn sẵn sàng và có thể gửi cùng request.'}</p><button id="closePreview" type="button">Đóng</button></div></div>`;$('closePreview').addEventListener('click',()=>renderOverlay());}
    $('fileInput').addEventListener('change',e=>{for(const file of e.target.files){const ext=file.name.split('.').pop().toLowerCase();demo.attachments.push(acceptedTypes.has(ext)?{name:file.name,status:'ready'}:{name:file.name,status:'rejected',reason:'Loại file không được chấp nhận'});}e.target.value='';renderComposer();});
    $('advanceBtn').addEventListener('click',advance);$('askBtn').addEventListener('click',()=>{if(!active())return;demo.clarificationKind=demo.followup?'scope':'audience';demo.stage='clarification';demo.state='R3';demo.messages.push({role:'assistant',text:clarificationPrompt(demo.clarificationKind)});render();});$('failBtn').addEventListener('click',failRequest);$('reloadBtn').addEventListener('click',()=>{if(!active())return;demo.state='H7';demo.notice='Giao diện được mở lại trong mô phỏng. Request vẫn active và không bắt đầu lại.';render();});$('restartBtn').addEventListener('click',()=>{if(!active())return;demo.state='H8';demo.stage='interrupted';demo.notice='DeckAgent đã dừng giữa request. Request cuối chưa hoàn tất; phần đã xong được giữ.';render();});$('statePicker').addEventListener('change',e=>setState(e.target.value));$('variantPicker').addEventListener('change',e=>setState($('statePicker').value,e.target.value));
    $('statePicker').innerHTML=Object.entries(stateGroups).map(([group,items])=>`<optgroup label="${group}">${items.map(([id,label])=>`<option value="${id}">${id} · ${esc(label)}</option>`).join('')}</optgroup>`).join('');
    setState('R1');
  </script>
</body>
</html>
